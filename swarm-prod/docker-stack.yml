# Stack do Prodcontrol (produção) para Docker Swarm em uma EC2.
# Substitui o docker-compose-backend-deployment-prod (compose + ALB).
#
# Deploy SEMPRE via deploy.sh, que exporta as variáveis abaixo:
#   WEB_IMAGE           imagem por digest (repo@sha256:...)
#   TRAEFIK_HOST_RULE   ex.: Host(`swarm.prodcontrol.app.br`)
#   ACME_EMAIL          e-mail do Let's Encrypt
#   DB_HOST DB_PORT DB_USER DB_PASSWORD  (usados pelo pgbouncer)
#
# Diferenças em relação ao compose atual:
#   - sem Upstash: cache, filas BullMQ e rate limit usam o redis do stack
#   - só o traefik publica portas (80/443); redis, pgbouncer e web ficam na rede interna
#   - init-check removido: healthchecks + restart do Swarm fazem esse papel
#   - web com 2 réplicas, deploy start-first e rollback automático

version: "3.8"

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=prodcontrol_internal
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?defina ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # Validação por DNS no Route 53: o certificado é emitido antes de o domínio
      # apontar para esta instância (troca de DNS sem erro de certificado).
      # Exige a política prodcontrol-swarm-acme-route53 na role da instância.
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=route53
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    environment:
      # Credenciais vêm da role da instância (IMDSv2, hop limit 2)
      AWS_REGION: us-east-2
      AWS_HOSTED_ZONE_ID: ${ROUTE53_ZONE_ID:-Z08950653QMOGGW25O5SQ}
    ports:
      # mode: host preserva o IP real do cliente (rate limit por IP depende disso)
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - internal
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s

  web:
    image: ${WEB_IMAGE:?defina WEB_IMAGE (repo@sha256:...)}
    env_file:
      - .env
    environment:
      # Sobrescrevem o .env: a API fala com o pgbouncer e o redis do stack
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      PORT: "8080"
      NODE_OPTIONS: "--trace-warnings --unhandled-rejections=strict --max-old-space-size=512"
      NODE_STARTUP_TIMEOUT: "30000"
      # Mesmo valor do compose atual; avaliar trocar para "info" depois da virada
      LOG_LEVEL: debug
    networks:
      - internal
    healthcheck:
      # /api/health devolve 503 quando o banco está indisponível
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 768M
      labels:
        - traefik.enable=true
        - traefik.http.routers.api.rule=${TRAEFIK_HOST_RULE:?defina TRAEFIK_HOST_RULE}
        - traefik.http.routers.api.entrypoints=websecure
        - traefik.http.routers.api.tls.certresolver=le
        - traefik.http.services.api.loadbalancer.server.port=8080
        - traefik.http.services.api.loadbalancer.healthcheck.path=/api/health
        - traefik.http.services.api.loadbalancer.healthcheck.interval=15s

  pgbouncer:
    # Fixar a mesma versão que roda hoje (ver README, Fase 0)
    image: ${PGBOUNCER_IMAGE:-pgbouncer/pgbouncer:latest}
    env_file:
      - .env
    environment:
      DATABASES: "* = host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASSWORD}"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "10"
      MIN_POOL_SIZE: "0"
      RESERVE_POOL_SIZE: "1"
      RESERVE_POOL_TIMEOUT: "1"
      MAX_CLIENT_CONN: "2000"
      # Atenção: com a infra antiga ligada em paralelo, o banco recebe até 2x este valor
      MAX_DB_CONNECTIONS: "50"
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_CHECK_DELAY: "2"
      SERVER_CHECK_QUERY: select 1
      SERVER_LIFETIME: "1800"
      SERVER_IDLE_TIMEOUT: "300"
      QUERY_TIMEOUT: "5"
      CLIENT_IDLE_TIMEOUT: "60"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: "statement_timeout,lock_timeout,idle_in_transaction_session_timeout"
      LOG_CONNECTIONS: "1"
      LOG_DISCONNECTIONS: "1"
      LOG_POOLER_ERRORS: "1"
      VERBOSE: "2"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s

  redis:
    image: redis:7.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-768mb}
      # BullMQ exige noeviction. Se a memória encher, escritas falham:
      # monitore o uso (ver README) antes que isso derrube a API.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s

networks:
  internal:
    driver: overlay
    name: prodcontrol_internal
    attachable: true

volumes:
  traefik-certs:
  redis-data:
